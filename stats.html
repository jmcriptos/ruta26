<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://wwzgpifvfmogjttwstxy.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a1512">
  <title>Ruta 26 · Estadísticas</title>
  <link rel="icon" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700;800&amp;family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "DM Sans", Arial, sans-serif;
      background: var(--bg); color: var(--txt);
      -webkit-font-smoothing: antialiased;
      --ink: #0a1512; --lime: #d7ff43; --orange: #ff7c42; --blue: #68a7ff;
      --accent: #68a7ff; --up: #2da45f; --down: #d4593f;
      --pad: 18px; --gap: 14px;
    }
    body[data-theme="claro"] {
      --bg: #f3f2eb; --card: #fbfaf5; --line: #ddddd2; --txt: #0a1512; --muted: #6e7772;
      --track: #ecebe1; --grid: #e4e3d8; --chip: #eeede3;
    }
    body[data-theme="oscuro"] {
      --bg: #0a1512; --card: #122019; --line: #22352c; --txt: #f3f2eb; --muted: #8da399;
      --track: #0e1a15; --grid: #1b2c24; --chip: #182a22; --up: #5fd692; --down: #ff9579;
    }
    .noise {
      position: fixed; inset: 0; z-index: 40; opacity: .025; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    }
    .dz-top {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; gap: 12px;
      padding: calc(12px + env(safe-area-inset-top)) 20px 12px;
      color: #fff; background: rgba(8, 20, 16, .92);
      border-bottom: 1px solid rgba(255, 255, 255, .09);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    .dz-back { display: inline-flex; align-items: center; gap: 8px; padding: 9px 13px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; color: #f3f2eb; background: rgba(10,21,18,.55); font: 700 12px/1 "DM Sans", Arial, sans-serif; text-decoration: none; }
    .dz-back:hover { background: rgba(10,21,18,.85); border-color: rgba(255,255,255,.35); }
    .dz-brand { display: flex; align-items: center; gap: 11px; }
    .dz-ball {
      flex: none; width: 34px; height: 34px; display: grid; place-items: center;
      color: var(--ink); background: var(--lime);
      border-radius: 50% 45% 50% 42%; transform: rotate(-8deg);
      font: 800 13px/1 "League Spartan", sans-serif;
    }
    .dz-brand-txt { font: 800 15px/1 "League Spartan", sans-serif; letter-spacing: -.5px; text-transform: uppercase; }
    .dz-brand-txt span { display: block; color: var(--lime); font-size: 8px; letter-spacing: 3px; margin-top: 2px; }
    .dz-top-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .dz-updated { font-size: 11px; color: rgba(255,255,255,.55); white-space: nowrap; }
    .dz-iconbtn {
      width: 34px; height: 34px; display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.18); border-radius: 50%;
      background: transparent; color: #fff; cursor: pointer; transition: .2s ease; padding: 0;
    }
    .dz-iconbtn:hover { border-color: var(--lime); color: var(--lime); }
    .dz-iconbtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
    .dz-iconbtn.spin svg { animation: dz-rot 1s linear infinite; }
    @keyframes dz-rot { to { transform: rotate(360deg); } }
    .dz-theme-toggle { display: flex; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 2px; }
    .dz-theme-toggle button {
      width: 30px; height: 28px; display: grid; place-items: center;
      border: 0; border-radius: 999px; background: transparent;
      color: rgba(255,255,255,.5); cursor: pointer; font-size: 13px; line-height: 1; padding: 0;
    }
    .dz-theme-toggle button.active { background: var(--lime); color: var(--ink); }

    .dz-main { max-width: 1180px; margin: 0 auto; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); }
    .dz-controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: var(--gap); }
    .dz-kicker { font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
    .dz-tabs { display: flex; gap: 4px; padding: 3px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; }
    .dz-tabs button {
      border: 0; background: transparent; color: var(--muted);
      font: 700 12px "DM Sans", sans-serif; padding: 6px 14px; border-radius: 999px;
      cursor: pointer; transition: .15s ease;
    }
    .dz-tabs button:hover { color: var(--txt); }
    .dz-tabs button.active { background: var(--accent); color: var(--ink); }
    .dz-status {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
      color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px;
      background: var(--card);
    }
    .dz-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--up); animation: dz-pulse 1.6s ease infinite; }
    @keyframes dz-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    .dz-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap); margin-bottom: var(--gap); }
    .dz-kpi {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: var(--pad); display: flex; flex-direction: column; gap: 6px; min-width: 0;
    }
    .dz-kpi small { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
    .dz-kpi-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .dz-kpi-row strong { font: 800 30px/1 "League Spartan", sans-serif; letter-spacing: -.5px; }
    .dz-kpi-row .of { font-size: 13px; color: var(--muted); font-weight: 500; }
    .dz-delta { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--chip); white-space: nowrap; }
    .dz-delta.up { color: var(--up); }
    .dz-delta.down { color: var(--down); }
    .dz-delta.flat { color: var(--muted); }
    .dz-kpi-spark { margin-top: auto; width: 100%; height: 30px; display: block; }
    .dz-progress { height: 7px; border-radius: 99px; background: var(--track); overflow: hidden; margin-top: auto; }
    .dz-progress i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .6s ease; }
    .dz-kpi .sub { font-size: 11px; color: var(--muted); }

    .dz-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); }
    .dz-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: var(--pad); min-width: 0; }
    .dz-card.span2 { grid-column: span 2; }
    .dz-card-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .dz-card-head h2 { margin: 0; font: 800 15px/1.1 "League Spartan", sans-serif; text-transform: uppercase; letter-spacing: -.3px; }
    .dz-card-head .aside { font-size: 11px; color: var(--muted); font-weight: 500; white-space: nowrap; }
    .dz-note { font-size: 11.5px; color: var(--muted); margin: 10px 0 0; line-height: 1.5; }
    .dz-empty { font-size: 13px; color: var(--muted); padding: 18px 0; text-align: center; margin: 0; }

    .dz-bar-row { display: flex; align-items: center; gap: 10px; padding: 4px 0; font-size: 13px; }
    .dz-bar-row .lbl { flex: 0 0 124px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
    .dz-bar-row .bar { flex: 1; height: 15px; background: var(--track); border-radius: 4px; overflow: hidden; }
    .dz-bar-row .bar i { display: block; height: 100%; border-radius: 4px; transition: width .6s ease; }
    .dz-bar-row .val { flex: 0 0 52px; text-align: right; font-weight: 700; font-size: 12px; font-variant-numeric: tabular-nums; }

    .dz-chart-wrap { position: relative; }
    .dz-chart-wrap svg { display: block; width: 100%; height: auto; }
    .dz-tip {
      position: absolute; top: 0; transform: translate(-50%, -4px);
      background: var(--ink); color: #fff; border-radius: 8px;
      padding: 7px 10px; font-size: 11.5px; line-height: 1.5; white-space: nowrap;
      pointer-events: none; z-index: 5; box-shadow: 0 8px 24px rgba(0,0,0,.25); display: none;
    }
    body[data-theme="oscuro"] .dz-tip { background: #f3f2eb; color: var(--ink); }
    .dz-legend { display: flex; gap: 16px; margin-top: 8px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
    .dz-legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dz-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

    .dz-donut-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .dz-donut-legend { display: flex; flex-direction: column; gap: 8px; font-size: 13px; min-width: 130px; flex: 1; }
    .dz-donut-legend .row { display: flex; align-items: center; gap: 8px; }
    .dz-donut-legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
    .dz-donut-legend .n { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; }
    .dz-donut-legend .pct { color: var(--muted); font-size: 11px; width: 34px; text-align: right; }

    .dz-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
    .dz-chips .pre { font-size: 11.5px; font-weight: 600; color: var(--muted); }
    .dz-chip { font-size: 11.5px; font-weight: 600; color: var(--muted); background: var(--chip); border-radius: 999px; padding: 4px 10px; }

    .dz-foot { max-width: 1180px; margin: 0 auto; padding: 0 20px calc(30px + env(safe-area-inset-bottom)); font-size: 11.5px; color: var(--muted); }
    .dz-loading { display: grid; place-items: center; padding: 90px 20px; gap: 14px; }
    .dz-loading .dz-ball { width: 46px; height: 46px; font-size: 17px; animation: dz-bounce 1s ease infinite; }
    @keyframes dz-bounce { 0%, 100% { transform: rotate(-8deg) translateY(0); } 50% { transform: rotate(-8deg) translateY(-9px); } }
    .dz-loading p { color: var(--muted); font-size: 13px; margin: 0; }
    .dz-err {
      background: rgba(212, 89, 63, .1); border: 1px solid rgba(212, 89, 63, .4);
      color: var(--down); border-radius: 12px; padding: 12px 16px; font-size: 13px; margin-bottom: var(--gap);
    }

    @media (max-width: 940px) {
      .dz-kpis { grid-template-columns: repeat(2, 1fr); }
      .dz-grid { grid-template-columns: 1fr 1fr; }
      .dz-card.span2 { grid-column: span 2; }
    }
    @media (max-width: 640px) {
      .dz-main { padding-left: 14px; padding-right: 14px; }
      .dz-grid { grid-template-columns: 1fr; }
      .dz-card.span2 { grid-column: span 1; }
      .dz-kpi-row strong { font-size: 26px; }
      .dz-updated { display: none; }
      .dz-back span { display: none; }
      .dz-back { padding: 9px 12px; }
      .dz-bar-row .lbl { flex-basis: 104px; font-size: 12px; }
    }
  </style>
</head>
<body data-theme="claro">
  <div class="noise"></div>

  <header class="dz-top">
    <a class="dz-back" href="index.html" aria-label="Volver a la app" title="Volver a la app">← <span>Volver a la app</span></a>
    <div class="dz-brand">
      <span class="dz-ball">26</span>
      <div class="dz-brand-txt">Stats<span>RUTA 26</span>quiniela</div>
    </div>
    <div class="dz-top-right">
      <span class="dz-updated" id="updated">cargando…</span>
      <button class="dz-iconbtn" id="refreshBtn" type="button" aria-label="Actualizar datos" title="Actualizar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"></path></svg>
      </button>
      <div class="dz-theme-toggle" role="group" aria-label="Tema">
        <button type="button" id="thClaro" aria-label="Tema claro" title="Tema claro">☀</button>
        <button type="button" id="thOscuro" aria-label="Tema oscuro" title="Tema oscuro">☾</button>
      </div>
    </div>
  </header>

  <div id="content">
    <div class="dz-loading">
      <span class="dz-ball">26</span>
      <p>Cargando datos en vivo…</p>
    </div>
  </div>

  <footer class="dz-foot">
    <span>Medición activa desde el 11 JUN 2026 · Analytics propio, sin cookies, respeta Do Not Track.</span>
  </footer>

  <script src="js/config.js?v=20260611k"></script>
  <script src="js/data.js?v=20260611k"></script>
  <script src="js/stats-dashboard.js?v=20260611-security1"></script>
</body>
</html>
