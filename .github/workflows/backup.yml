name: Respaldo de la quiniela

# Respalda las tablas del juego (profiles, predictions, champion_picks) y la lista
# de usuarios de Auth a un artifact privado descargable. No commitea nada al repo.
# Requiere el secret SUPABASE_SERVICE_KEY (Settings → Secrets and variables → Actions).

on:
  schedule:
    # cada 6 horas: 05:00, 11:00, 17:00 y 23:00 en Curaçao (UTC-4) —
    # cubre la mañana, la tanda de picks antes de los partidos y el cierre del día
    - cron: "0 3 * * *"
    - cron: "0 9 * * *"
    - cron: "0 15 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch: {}    # botón para correrlo a mano

permissions:
  contents: read

concurrency:
  group: quiniela-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Exportar tablas y usuarios
        env:
          SUPABASE_URL: https://wwzgpifvfmogjttwstxy.supabase.co
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SERVICE_KEY:-}" ]; then
            echo "ERROR: falta el secret SUPABASE_SERVICE_KEY"; exit 1
          fi
          mkdir -p backup
          stamp=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          echo "Respaldo $stamp" > backup/INFO.txt

          # $1 = tabla, $2 = columnas de orden (paginación estable). El proyecto tiene
          # "Max Rows = 1000" como tope duro del servidor: ningún limit lo supera, así
          # que paginamos en páginas de 1000 con offset hasta traer la tabla completa.
          rest() {
            table="$1"; order="$2"; page=1000; offset=0; total=0
            : > "backup/$table.ndjson"
            while : ; do
              curl -fsS "$SUPABASE_URL/rest/v1/$table?select=*&order=$order&limit=$page&offset=$offset" \
                -H "apikey: $SERVICE_KEY" \
                -H "Authorization: Bearer $SERVICE_KEY" \
                -o "backup/page.json"
              n=$(jq 'if type=="array" then length else error("'"$table"' no es un array JSON") end' "backup/page.json")
              jq -c '.[]' "backup/page.json" >> "backup/$table.ndjson"
              total=$((total + n))
              [ "$n" -lt "$page" ] && break
              offset=$((offset + page))
            done
            jq -s '.' "backup/$table.ndjson" > "backup/$table.json"
            rm -f "backup/$table.ndjson" "backup/page.json"
            echo "  $table: $total filas"
          }

          echo "Exportando tablas del juego…"
          rest profiles "id"
          rest predictions "user_id,match_id"
          rest champion_picks "user_id"
          rest matches "id"

          echo "Exportando usuarios de Auth (admin API)…"
          curl -fsS "$SUPABASE_URL/auth/v1/admin/users?per_page=1000" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -o "backup/auth_users.json"

          echo "Contenido del respaldo:"
          ls -la backup/

      - name: Subir artifact
        uses: actions/upload-artifact@v7
        with:
          name: quiniela-backup
          path: backup/
          retention-days: 90
