name: Resetear contraseña de jugador

# Soporte manual: cuando un jugador olvida su contraseña, el admin le asigna una
# nueva con la service key (tools/reset-password.js). La quiniela no tiene
# recuperación por correo porque usa emails sintéticos sin buzón real.
# Requiere el secret SUPABASE_SERVICE_KEY (ya existe).

on:
  workflow_dispatch:
    inputs:
      username:
        description: "Usuario al que se le reasigna la contraseña"
        required: true
      password:
        description: "Nueva contraseña (mín. 6; vacío = se genera una temporal y se muestra)"
        default: ""
      dry_run:
        description: "1 = solo verificar que el usuario existe, sin cambiar nada"
        default: "1"

permissions:
  contents: read

concurrency:
  group: reset-password
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Resetear contraseña
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESET_USERNAME: ${{ github.event.inputs.username }}
          RESET_PASSWORD: ${{ github.event.inputs.password }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '1' }}
        run: node tools/reset-password.js
