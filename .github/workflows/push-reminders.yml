name: Push pre-partido de la quiniela

# Cada 15 min revisa si hay partidos próximos (ventana 180 min, dedupe a un push) y manda
# un push a TODOS los suscriptores con el % de la quiniela (tools/send-push-reminders.js).
# Dedupe en la tabla push_sent: cada (partido, usuario) se avisa una sola vez.
# Requiere secrets: SUPABASE_SERVICE_KEY (ya existe) y VAPID_PRIVATE_KEY.

on:
  schedule:
    # GitHub advierte que al inicio de cada hora los cron pueden retrasarse o
    # descartarse; usar minutos desplazados reduce ese riesgo.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = solo listar a quién se avisaría, sin enviar"
        default: "1"
      test_username:
        description: "Push dirigido a estos usuarios (coma-separados; ignora ventana y dry_run)"
        default: ""
      test_match:
        description: "Número de partido para test_username (vacío = próximo del calendario)"
        default: ""
      diagnostic_username:
        description: "Diagnosticar este usuario sin enviar ni modificar datos"
        default: ""
      window_min:
        description: "Ampliar la ventana a N minutos (envio manual adelantado)"
        default: ""

permissions:
  contents: read

concurrency:
  group: push-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Instalar web-push
        run: npm install --no-save --ignore-scripts --package-lock=false web-push@3.6.7
      - name: Enviar recordatorios
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_PUBLIC_KEY: "BFovXeG7ex6_Y8NWZO9k_TRWWkXZTlgRK-nc6vaKhxfO0UBrc1G9Ov4CP23rEtIxSmVTqu-6GKVTaKBLzGt87Jg"
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          TEST_USERNAME: ${{ github.event.inputs.test_username || '' }}
          TEST_MATCH: ${{ github.event.inputs.test_match || '' }}
          DIAG_USERNAME: ${{ github.event.inputs.diagnostic_username || '' }}
          WINDOW_MIN: ${{ github.event.inputs.window_min || '' }}
        run: node tools/send-push-reminders.js
